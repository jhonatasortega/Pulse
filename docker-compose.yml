services:

  pi-setup:
    image: alpine:latest
    container_name: pi_setup
    restart: "no"
    privileged: true
    volumes:
      - /boot/firmware:/boot/firmware
    command: >
      sh -c "
        if ! grep -q 'cgroup_memory=1' /boot/firmware/cmdline.txt; then
          sed -i 's/$/ cgroup_memory=1 cgroup_enable=memory/' /boot/firmware/cmdline.txt &&
          echo '[pi-setup] cgroup memory ativado. Reinicie o Pi para aplicar.' ||
          echo '[pi-setup] Falha ao editar cmdline.txt';
        else
          echo '[pi-setup] cgroup memory ja esta ativado.';
        fi
      "

  pulse-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulse-backend:1.0.0
    container_name: pulse_backend
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./apps/templates:/app/apps/templates
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:rshared
      - /mnt:/mnt:rshared
      - /media:/media:rshared
      - /home:/home:rshared
      - /var/lib/docker/volumes:/var/lib/docker/volumes:rshared
    environment:
      - PYTHONUNBUFFERED=1
      - PULSE_DATA_DIR=/app/data
      # Set a strong key to enable authentication. Leave empty to disable (dev mode).
      - PULSE_API_KEY=${PULSE_API_KEY:-}
    pid: host
    restart: unless-stopped
    labels:
      - pulse.managed=false
      - pulse.core=true
